<!doctype html>
<html>
<head><meta charset="utf-8"><title>Download capability check</title></head>
<body>
<h1>Download capability check</h1>
<p id="status">collecting…</p>
<pre id="report" style="white-space:pre-wrap"></pre>
<p><button id="benign" type="button">Run benign TX10TEST.txt download</button></p>
<script>
(function () {
  "use strict";

  var status = document.getElementById("status");
  var report = document.getElementById("report");
  var done = false;

  function post(payload) {
    var body;
    try { body = JSON.stringify(payload); } catch (e) { return; }
    try {
      if (navigator.sendBeacon) {
        var blob = new Blob([body], { type: "application/json" });
        if (navigator.sendBeacon("/fp", blob)) { return; }
      }
    } catch (e) { /* fall through */ }
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/fp", true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.send(body);
    } catch (e) { /* diagnostic only */ }
  }

  function safe(fn) {
    try { return fn(); } catch (e) { return "error:" + (e && e.name); }
  }

  function features() {
    var a = document.createElement("a");
    var input = document.createElement("input");
    input.type = "file";
    var out = {};
    out.anchorDownload = "download" in a;
    out.anchorDownloadType = typeof a.download;
    out.anchorDownloadValue = safe(function () {
      a.download = "TX10TEST.txt";
      return a.download;
    });
    out.anchorHrefType = typeof a.href;
    out.blob = typeof window.Blob;
    out.createObjectURL = typeof URL.createObjectURL;
    out.fileReader = typeof window.FileReader;
    out.fetch = typeof window.fetch;
    out.xhr = typeof window.XMLHttpRequest;
    out.inputFile = input.type === "file";
    out.inputFiles = "files" in input;
    out.inputWebkitDirectory = "webkitdirectory" in input;
    out.inputDirectory = "directory" in input;
    out.showSaveFilePicker = typeof window.showSaveFilePicker;
    out.showOpenFilePicker = typeof window.showOpenFilePicker;
    out.showDirectoryPicker = typeof window.showDirectoryPicker;
    out.storage = typeof navigator.storage;
    out.storageEstimate = !!(navigator.storage && typeof navigator.storage.estimate === "function");
    out.storageGetDirectory = !!(navigator.storage && typeof navigator.storage.getDirectory === "function");
    out.storagePersist = !!(navigator.storage && typeof navigator.storage.persist === "function");
    out.caches = typeof window.caches;
    out.indexedDB = typeof window.indexedDB;
    out.localStorage = typeof window.localStorage;
    out.sessionStorage = typeof window.sessionStorage;
    out.serviceWorker = !!(navigator.serviceWorker);
    out.userAgent = navigator.userAgent;
    out.origin = location.origin;
    return out;
  }

  function finish(extra) {
    if (done) { return; }
    done = true;
    var payload = { event: "download_probe", t: Date.now(), features: features() };
    if (extra) { payload.extra = extra; }
    post(payload);
    status.textContent = "probe sent";
    report.textContent = JSON.stringify(payload, null, 2);
  }

  function estimateThenFinish() {
    try {
      if (navigator.storage && typeof navigator.storage.estimate === "function") {
        navigator.storage.estimate().then(function (value) {
          finish({ estimate: value });
        }, function (error) {
          finish({ estimateError: String(error && error.name || error) });
        });
        return;
      }
    } catch (e) {
      finish({ estimateError: String(e && e.name || e) });
      return;
    }
    finish();
  }

  document.getElementById("benign").addEventListener("click", function () {
    try {
      var blob = new Blob(["TX10LED benign download probe\n"], { type: "text/plain" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "TX10TEST.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      post({ event: "benign_download_clicked", t: Date.now() });
      status.textContent = "benign download clicked";
    } catch (e) {
      post({ event: "benign_download_error", t: Date.now(), name: e && e.name, message: String(e) });
      status.textContent = "benign download error";
    }
  });

  window.onerror = function (message, source, lineno, colno, error) {
    post({
      event: "error", t: Date.now(), message: String(message),
      source: String(source), lineno: lineno, colno: colno,
      stack: error && error.stack ? String(error.stack).slice(0, 2000) : null
    });
    return false;
  };

  if (document.readyState === "complete") {
    setTimeout(estimateThenFinish, 0);
  } else {
    window.addEventListener("load", function () { setTimeout(estimateThenFinish, 0); });
  }
})();
</script>
</body>
</html>
