<!doctype html>
<html>
<head><meta charset="utf-8"><title>Network check</title></head>
<body>
<h1>Network check</h1>
<p id="status">starting…</p>
<script>
(function () {
  var TOTAL = 60;
  var index = 0;
  var done = false;

  function post(stage, extra) {
    var payload = { stage: stage, ua: navigator.userAgent };
    if (extra) {
      for (var key in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, key)) {
          payload[key] = extra[key];
        }
      }
    }
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/fp", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(JSON.stringify(payload));
  }

  function next() {
    if (done) {
      return;
    }
    if (index >= TOTAL) {
      done = true;
      post("done", { count: TOTAL });
      document.getElementById("status").textContent = "done";
      return;
    }
    var current = index;
    index++;
    post("iteration", { i: current });
    var img = new Image();
    var settled = false;
    img.onload = function () {
      if (settled) { return; }
      settled = true;
      setTimeout(next, 40);
    };
    img.onerror = function () {
      if (settled) { return; }
      settled = true;
      setTimeout(next, 40);
    };
    img.src = "/assets/nso.webp?i=" + current;
  }

  post("start", { total: TOTAL });
  setTimeout(next, 100);
})();
</script>
</body>
</html>
