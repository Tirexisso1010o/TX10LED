<!doctype html>
<html>
<head><meta charset="utf-8"><title>Network check</title></head>
<body>
<h1>Network check</h1>
<p id="status">starting…</p>
<script>
(function () {
  var order = ["bad", "nso"];
  var index = 0;
  var finished = false;

  function post(stage, extra) {
    var payload = { stage: stage, ua: navigator.userAgent };
    if (extra) {
      for (var key in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, key)) {
          payload[key] = extra[key];
        }
      }
    }
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/fp", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.send(JSON.stringify(payload));
  }

  function next() {
    if (finished) {
      return;
    }
    if (index >= order.length) {
      finished = true;
      post("done");
      document.getElementById("status").textContent = "done";
      return;
    }
    var name = order[index];
    index++;
    post("request", { name: name });
    var img = new Image();
    var settled = false;
    img.onload = function () {
      if (settled) { return; }
      settled = true;
      post("result", { name: name, ok: true, w: img.naturalWidth, h: img.naturalHeight });
      setTimeout(next, 300);
    };
    img.onerror = function () {
      if (settled) { return; }
      settled = true;
      post("result", { name: name, ok: false });
      setTimeout(next, 300);
    };
    img.src = "/assets/" + name + ".webp";
  }

  setTimeout(function () {
    if (!finished) {
      post("alive");
    }
  }, 6000);

  setTimeout(next, 100);
})();
</script>
</body>
</html>
